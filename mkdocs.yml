site_name: mkdocs-demo
site_description: Voorbeeld MkDocs project met automatische inrichting
site_author: Ruud Hirschmann
repo_url: https://github.com/rhirschmann/mkdocs-demo
repo_name: rhirschmann/mkdocs-demo

copyright: Copyright &copy; 2026 Ruud Hirschmann

theme:
  name: material
  language: nl
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Schakel naar donkere modus
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Schakel naar lichte modus
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhirschmann/mkdocs-demo
      name: GitHub

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - Introductie: getting-started/index.md
      - Installatie: getting-started/install.md
  - Over: about/index.md
  - Changelog: changelog.md
  - Tags: tags.md

plugins:
  - search
  - tags:
      tags_file: tags.md