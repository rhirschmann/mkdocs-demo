site_name: mkdocs-demo
site_url: https://rhirschmann.github.io/mkdocs-demo/
site_description: Voorbeeld MkDocs project met automatische inrichting
site_author: Ruud Hirschmann
repo_url: https://github.com/rhirschmann/mkdocs-demo
repo_name: rhirschmann/mkdocs-demo

copyright: Copyright &copy; 2026 Ruud Hirschmann

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: nl
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Schakel naar donkere modus
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Schakel naar lichte modus
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhirschmann/mkdocs-demo
      name: GitHub

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - Introductie: getting-started/index.md
      - Installatie: getting-started/install.md
      - Deployment: getting-started/deployment.md
      - Alternatieven: getting-started/alternatieven.md
  - Features: 
      - features/index.md
      - Opmaak & Styling: features/opmaak.md
      - Code & Tabs: features/code.md
      - Diagrammen: features/diagrammen.md
      - Navigatie & Verwijzingen: features/navigatie.md
      - Blog: features/blog.md
      - Meertaligheid: features/meertaligheid.md
      - 404-pagina: features/404.md
  - Blog: 
      - blog/index.md
  - Over: about/index.md
  - Changelog: changelog.md
  - Tags: tags.md

plugins:
  - search
  - material/tags
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_readtime: true
      archive: true
      archive_name: Archief
      archive_date_format: MMMM yyyy
      archive_toc: true
      categories: true
      categories_name: Categorieën
      categories_toc: true
      pagination: true
      pagination_per_page: 10
      